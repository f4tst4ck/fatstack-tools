# contracts/ is intentionally empty until day 22. See README.md and CLAUDE.md.
# This file exists so the package has a home; there is nothing to build yet.
[profile.default]
# The splitter asserts the same fee vectors the TypeScript SDK does, read from the shared
# JSON file, so the two implementations cannot drift apart unnoticed.
fs_permissions = [{ access = "read", path = "./test" }]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
